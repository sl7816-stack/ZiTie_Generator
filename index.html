<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>典雅書法集字帖產生器 - 精準切分版</title>
  
  <meta name="theme-color" content="#1e242b">

  <!-- OpenCV & External Libraries -->
  <script async src="https://docs.opencv.org/4.x/opencv.js" onload="onOpenCvReady()"></script>
  <script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #f5f0eb 0%, #e6ded6 100%);
      --card-bg: rgba(255, 255, 255, 0.85);
      --card-border: rgba(210, 200, 190, 0.5);
      --primary-dark: #1e242b;
      --accent-red: #c0392b;
      --accent-red-hover: #a93226;
      --text-main: #2c3e50;
      --text-muted: #7f8c8d;
      --shadow-sm: 0 4px 15px rgba(0,0,0,0.05);
      --shadow-lg: 0 10px 30px rgba(0,0,0,0.12);
      --radius: 12px;
    }

    * { box-sizing: border-box; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      background: var(--bg-gradient);
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      color: var(--text-main);
      touch-action: manipulation;
    }

    .container {
      max-width: 1280px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 24px;
    }
    header h1 {
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--primary-dark);
      margin: 0 0 6px 0;
      letter-spacing: 2px;
    }
    header p {
      margin: 0;
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .panel {
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 18px 22px;
      box-shadow: var(--shadow-sm);
      margin-bottom: 20px;
    }

    .controls-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
      align-items: end;
    }

    .control-item {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .control-item label {
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--primary-dark);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .control-item label span.val-tag {
      background: rgba(192, 57, 43, 0.1);
      color: var(--accent-red);
      padding: 1px 6px;
      border-radius: 4px;
      font-family: monospace;
      font-weight: bold;
    }

    .file-btn-wrapper {
      position: relative;
      overflow: hidden;
      display: inline-block;
      width: 100%;
    }

    .file-btn-wrapper input[type=file] {
      font-size: 100px;
      position: absolute;
      left: 0; top: 0;
      opacity: 0;
      cursor: pointer;
    }

    .btn-custom {
      background: white;
      border: 1px solid #ccc;
      color: var(--text-main);
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
    }
    .btn-custom:hover {
      border-color: var(--accent-red);
      color: var(--accent-red);
    }

    select, input[type="range"] {
      width: 100%;
      height: 38px;
      padding: 0 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      background: white;
      font-size: 0.88rem;
      outline: none;
    }

    input[type="range"] {
      padding: 0;
      cursor: pointer;
      accent-color: var(--accent-red);
    }

    .btn-primary {
      background: var(--accent-red);
      color: white;
      border: none;
      height: 38px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(192, 57, 43, 0.25);
    }
    .btn-primary:hover { background: var(--accent-red-hover); }

    .workspace {
      display: grid;
      grid-template-columns: 1fr 1.2fr;
      gap: 20px;
    }
    @media (max-width: 868px) {
      .workspace { grid-template-columns: 1fr; }
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(0,0,0,0.06);
    }
    .panel-header h3 {
      margin: 0;
      font-size: 1rem;
      font-weight: 700;
      color: var(--primary-dark);
    }

    #source-wrapper {
      position: relative;
      border: 1px solid #ccc;
      border-radius: 8px;
      min-height: 300px;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #faf8f5;
      overflow: hidden;
      user-select: none;
    }
    #sourceCanvas {
      display: block;
      max-width: 100%;
      height: auto;
    }

    #grid-output-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
      gap: 12px;
      padding: 12px;
      background: #f0ebe5;
      border-radius: 8px;
      max-height: 70vh;
      overflow-y: auto;
    }

    .char-card {
      background: white;
      border-radius: 8px;
      padding: 6px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.06);
      text-align: center;
      cursor: pointer;
      position: relative;
      transition: transform 0.2s ease;
    }
    .char-card:hover { transform: translateY(-3px); }
    .char-card canvas { width: 100%; height: auto; display: block; border-radius: 4px; }
    .char-card .card-index {
      position: absolute;
      top: 4px; right: 4px;
      background: rgba(0,0,0,0.5);
      color: white;
      font-size: 10px;
      padding: 1px 5px;
      border-radius: 10px;
    }

    #loadingOverlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(30, 36, 43, 0.75);
      color: white;
      justify-content: center;
      align-items: center;
      z-index: 2000;
      flex-direction: column;
      gap: 12px;
    }
    .spinner {
      width: 40px; height: 40px;
      border: 3px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<div id="loadingOverlay">
  <div class="spinner"></div>
  <div id="loadingText">載入演算法庫中...</div>
</div>

<div class="container">
  <header>
    <h1>🖌️ 典雅書法集字帖產生器</h1>
    <p>可調式選取框 · 防拆分/防黏連切分 · 一鍵打包下載</p>
  </header>

  <div class="panel">
    <div class="controls-grid">
      <div class="control-item">
        <label>1. 上傳字帖圖片</label>
        <div class="file-btn-wrapper">
          <button class="btn-custom">📁 選擇圖片檔案</button>
          <input type="file" id="fileInput" accept="image/*,.heic,.heif">
        </div>
      </div>

      <div class="control-item">
        <label>2. 格線類型</label>
        <select id="gridTypeSelect" onchange="renderAllCharCards()">
          <option value="jiu_gong_ge" selected>九宮格</option>
          <option value="mi_zi_ge">米字格</option>
        </select>
      </div>

      <div class="control-item">
        <label>3. 偏旁合併感度 <span class="val-tag" id="mergeVal">25px</span></label>
        <input type="range" id="mergeThresh" min="5" max="80" value="25" oninput="onParamChange()">
      </div>

      <div class="control-item">
        <label>4. 字體縮放比例 <span class="val-tag" id="scaleVal">80%</span></label>
        <input type="range" id="fontScale" min="60" max="95" value="80" oninput="updateScaleLabel(this.value)">
      </div>

      <div class="control-item">
        <button class="btn-primary" onclick="downloadZip()">📦 打包下載全部 (ZIP)</button>
      </div>
    </div>
  </div>

  <div class="workspace">
    <div class="panel">
      <div class="panel-header">
        <h3>🖼️ 原圖與選取框調整</h3>
        <button class="btn-custom" style="padding: 4px 10px; font-size: 0.75rem;" onclick="resetCropRegion()">重置框選</button>
      </div>
      <div id="source-wrapper">
        <canvas id="sourceCanvas"></canvas>
      </div>
      <p style="font-size:0.75rem; color:var(--text-muted); margin-top:8px; text-align:center;">
        💡 提示：按住選取框可移動，拖曳 8 個邊角控制點可調整大小。
      </p>
    </div>

    <div class="panel">
      <div class="panel-header">
        <h3>墨跡切分結果</h3>
        <span style="font-size:0.8rem; color:var(--text-muted);" id="charCountTag">共 0 字</span>
      </div>
      <div id="grid-output-container"></div>
    </div>
  </div>
</div>

<script>
  let cvReady = false;
  let sourceImg = null;
  let alphaCanvas = null;
  let finalBoxes = [];

  // Canvas 選取框狀態
  let cropBox = null; // {x, y, w, h} 比例單位 (0~1)
  let isDrawing = false, isDragging = false, isResizing = false;
  let activeHandle = null;
  let startX = 0, startY = 0, dragOffsetX = 0, dragOffsetY = 0;
  const HANDLE_SIZE = 8;

  function onOpenCvReady() {
    cvReady = true;
    hideLoading();
  }

  function showLoading(msg) {
    document.getElementById('loadingText').innerText = msg;
    document.getElementById('loadingOverlay').style.display = 'flex';
  }
  function hideLoading() {
    document.getElementById('loadingOverlay').style.display = 'none';
  }

  window.onload = () => { if (!cvReady) showLoading('系統初始化中...'); };

  function updateScaleLabel(val) {
    document.getElementById('scaleVal').innerText = val + '%';
    renderAllCharCards();
  }

  function onParamChange() {
    document.getElementById('mergeVal').innerText = document.getElementById('mergeThresh').value + 'px';
    processImage();
  }

  // 讀取檔案
  document.getElementById('fileInput').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;

    showLoading('正在載入圖片...');
    let blob = file;

    if (file.name.toLowerCase().endsWith('.heic') || file.name.toLowerCase().endsWith('.heif')) {
      try {
        const res = await heic2any({ blob: file, toType: "image/jpeg" });
        blob = Array.isArray(res) ? res[0] : res;
      } catch (err) {
        alert('HEIC 轉碼失敗');
        hideLoading();
        return;
      }
    }

    const reader = new FileReader();
    reader.onload = (event) => {
      const img = new Image();
      img.onload = () => {
        sourceImg = img;
        cropBox = { x: 0.05, y: 0.05, w: 0.9, h: 0.9 }; // 預設 90% 選擇框
        alphaCanvas = null;
        redrawSourceCanvas();
        processImage();
        hideLoading();
      };
      img.src = event.target.result;
    };
    reader.readAsDataURL(blob);
  });

  const sCanvas = document.getElementById('sourceCanvas');
  const ctx = sCanvas.getContext('2d');

  function redrawSourceCanvas() {
    if (!sourceImg) return;
    sCanvas.width = sourceImg.width;
    sCanvas.height = sourceImg.height;

    ctx.clearRect(0, 0, sCanvas.width, sCanvas.height);
    ctx.drawImage(sourceImg, 0, 0);

    if (!cropBox) return;

    const bx = cropBox.x * sCanvas.width;
    const by = cropBox.y * sCanvas.height;
    const bw = cropBox.w * sCanvas.width;
    const bh = cropBox.h * sCanvas.height;

    // 暗色半透明遮罩
    ctx.fillStyle = 'rgba(0, 0, 0, 0.35)';
    ctx.fillRect(0, 0, sCanvas.width, sCanvas.height);
    ctx.clearRect(bx, by, bw, bh);
    ctx.drawImage(sourceImg, bx, by, bw, bh, bx, by, bw, bh);

    // 繪製選擇框紅線
    ctx.strokeStyle = '#c0392b';
    ctx.lineWidth = Math.max(2, sCanvas.width * 0.004);
    ctx.strokeRect(bx, by, bw, bh);

    // 繪製 8 個控制點
    const handles = getHandleCoords(bx, by, bw, bh);
    ctx.fillStyle = '#ffffff';
    ctx.strokeStyle = '#c0392b';
    ctx.lineWidth = 2;
    for (let key in handles) {
      let h = handles[key];
      ctx.fillRect(h.x - HANDLE_SIZE, h.y - HANDLE_SIZE, HANDLE_SIZE * 2, HANDLE_SIZE * 2);
      ctx.strokeRect(h.x - HANDLE_SIZE, h.y - HANDLE_SIZE, HANDLE_SIZE * 2, HANDLE_SIZE * 2);
    }
  }

  function getHandleCoords(x, y, w, h) {
    return {
      nw: { x: x, y: y },
      n:  { x: x + w / 2, y: y },
      ne: { x: x + w, y: y },
      e:  { x: x + w, y: y + h / 2 },
      se: { x: x + w, y: y + h },
      s:  { x: x + w / 2, y: y + h },
      sw: { x: x, y: y + h },
      w:  { x: x, y: y + h / 2 }
    };
  }

  // 手勢與滑鼠操控選擇框
  sCanvas.addEventListener('pointerdown', (e) => {
    if (!sourceImg || !cropBox) return;
    const rect = sCanvas.getBoundingClientRect();
    const scaleX = sCanvas.width / rect.width;
    const scaleY = sCanvas.height / rect.height;

    const mx = (e.clientX - rect.left) * scaleX;
    const my = (e.clientY - rect.top) * scaleY;

    const bx = cropBox.x * sCanvas.width;
    const by = cropBox.y * sCanvas.height;
    const bw = cropBox.w * sCanvas.width;
    const bh = cropBox.h * sCanvas.height;

    const handles = getHandleCoords(bx, by, bw, bh);
    for (let key in handles) {
      let h = handles[key];
      if (Math.abs(mx - h.x) <= HANDLE_SIZE * 2 && Math.abs(my - h.y) <= HANDLE_SIZE * 2) {
        isResizing = true;
        activeHandle = key;
        startX = mx; startY = my;
        sCanvas.setPointerCapture(e.pointerId);
        return;
      }
    }

    if (mx >= bx && mx <= bx + bw && my >= by && my <= by + bh) {
      isDragging = true;
      dragOffsetX = mx - bx;
      dragOffsetY = my - by;
      sCanvas.setPointerCapture(e.pointerId);
      return;
    }

    // 點擊區域外，重新拉新框
    isDrawing = true;
    startX = mx; startY = my;
    cropBox = { x: mx / sCanvas.width, y: my / sCanvas.height, w: 0, h: 0 };
    sCanvas.setPointerCapture(e.pointerId);
  });

  sCanvas.addEventListener('pointermove', (e) => {
    if (!sourceImg || !cropBox) return;
    const rect = sCanvas.getBoundingClientRect();
    const scaleX = sCanvas.width / rect.width;
    const scaleY = sCanvas.height / rect.height;

    const mx = (e.clientX - rect.left) * scaleX;
    const my = (e.clientY - rect.top) * scaleY;

    if (isDrawing) {
      let nw = (mx - startX) / sCanvas.width;
      let nh = (my - startY) / sCanvas.height;
      cropBox.w = nw; cropBox.h = nh;
      redrawSourceCanvas();
    } else if (isDragging) {
      let nx = (mx - dragOffsetX) / sCanvas.width;
      let ny = (my - dragOffsetY) / sCanvas.height;
      cropBox.x = Math.max(0, Math.min(1 - cropBox.w, nx));
      cropBox.y = Math.max(0, Math.min(1 - cropBox.h, ny));
      redrawSourceCanvas();
    } else if (isResizing && activeHandle) {
      let dx = (mx - startX) / sCanvas.width;
      let dy = (my - startY) / sCanvas.height;

      if (activeHandle.includes('e')) cropBox.w += dx;
      if (activeHandle.includes('s')) cropBox.h += dy;
      if (activeHandle.includes('w')) { cropBox.x += dx; cropBox.w -= dx; }
      if (activeHandle.includes('n')) { cropBox.y += dy; cropBox.h -= dy; }

      startX = mx; startY = my;
      redrawSourceCanvas();
    }
  });

  sCanvas.addEventListener('pointerup', (e) => {
    if (isDrawing || isDragging || isResizing) {
      if (cropBox.w < 0) { cropBox.x += cropBox.w; cropBox.w = Math.abs(cropBox.w); }
      if (cropBox.h < 0) { cropBox.y += cropBox.h; cropBox.h = Math.abs(cropBox.h); }
      
      isDrawing = false; isDragging = false; isResizing = false; activeHandle = null;
      redrawSourceCanvas();
      processImage();
    }
  });

  function resetCropRegion() {
    if (!sourceImg) return;
    cropBox = { x: 0, y: 0, w: 1, h: 1 };
    redrawSourceCanvas();
    processImage();
  }

  // 核心演算法：圖像預處理與結構合併
  function processImage() {
    if (!cvReady || !sourceImg || !cropBox) return;

    let src = cv.imread(sCanvas);
    let gray = new cv.Mat();
    cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);

    let binary = new cv.Mat();
    let meanVal = cv.mean(gray)[0];
    if (meanVal < 128) {
      cv.threshold(gray, binary, 0, 255, cv.THRESH_BINARY | cv.THRESH_OTSU);
    } else {
      cv.threshold(gray, binary, 0, 255, cv.THRESH_BINARY_INV | cv.THRESH_OTSU);
    }

    if (!alphaCanvas) prepareAlphaCanvas(binary);

    // 防拆分演算法：膨脹並進行距離感應合併
    let mergeDist = parseInt(document.getElementById('mergeThresh').value);
    let dilated = new cv.Mat();
    let kSize = Math.max(3, Math.round(mergeDist / 3));
    let M = cv.Mat.ones(kSize, kSize, cv.CV_8U);
    cv.dilate(binary, dilated, M);

    let contours = new cv.MatVector();
    let hierarchy = new cv.Mat();
    cv.findContours(dilated, contours, hierarchy, cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);

    let bx = cropBox.x * sCanvas.width;
    let by = cropBox.y * sCanvas.height;
    let bw = cropBox.w * sCanvas.width;
    let bh = cropBox.h * sCanvas.height;

    let rawBoxes = [];
    const imgArea = sCanvas.width * sCanvas.height;

    for (let i = 0; i < contours.size(); ++i) {
      let rect = cv.boundingRect(contours.get(i));
      let area = rect.width * rect.height;

      // 限定在選擇框內部
      if (rect.x >= bx - 5 && (rect.x + rect.width) <= (bx + bw + 5) &&
          rect.y >= by - 5 && (rect.y + rect.height) <= (by + bh + 5)) {
        if (area > imgArea * 0.0008) {
          rawBoxes.push(rect);
        }
      }
    }

    // 幾何防黏連與防拆分重組
    let mergedBoxes = [];
    while (rawBoxes.length > 0) {
      let cur = rawBoxes.shift();
      let merged = true;

      while (merged) {
        merged = false;
        for (let i = 0; i < rawBoxes.length; i++) {
          let target = rawBoxes[i];
          let closeX = (Math.max(cur.x, target.x) - Math.min(cur.x + cur.width, target.x + target.width)) < mergeDist;
          let closeY = (Math.max(cur.y, target.y) - Math.min(cur.y + cur.height, target.y + target.height)) < mergeDist;

          if (closeX && closeY) {
            let minX = Math.min(cur.x, target.x);
            let minY = Math.min(cur.y, target.y);
            let maxX = Math.max(cur.x + cur.width, target.x + target.width);
            let maxY = Math.max(cur.y + cur.height, target.y + target.height);

            cur = { x: minX, y: minY, width: maxX - minX, height: maxY - minY };
            rawBoxes.splice(i, 1);
            merged = true;
            break;
          }
        }
      }
      mergedBoxes.push(cur);
    }

    // 依傳統書法直排規則排序（由右至左，由上至下）
    mergedBoxes.sort((a, b) => {
      let xDiff = (b.x + b.width / 2) - (a.x + a.width / 2);
      if (Math.abs(xDiff) > (sCanvas.width * 0.08)) return xDiff;
      return a.y - b.y;
    });

    finalBoxes = mergedBoxes;

    gray.delete(); binary.delete(); dilated.delete(); M.delete();
    contours.delete(); hierarchy.delete(); src.delete();

    renderAllCharCards();
  }

  function prepareAlphaCanvas(binaryMat) {
    alphaCanvas = document.createElement('canvas');
    alphaCanvas.width = sourceImg.width;
    alphaCanvas.height = sourceImg.height;
    const alphaCtx = alphaCanvas.getContext('2d');

    const maskCanvas = document.createElement('canvas');
    maskCanvas.width = binaryMat.cols;
    maskCanvas.height = binaryMat.rows;
    cv.imshow(maskCanvas, binaryMat);

    const maskCtx = maskCanvas.getContext('2d');
    const maskData = maskCtx.getImageData(0, 0, maskCanvas.width, maskCanvas.height);
    const transparentImgData = alphaCtx.createImageData(maskCanvas.width, maskCanvas.height);

    for (let i = 0; i < maskData.data.length; i += 4) {
      transparentImgData.data[i + 3] = maskData.data[i] > 128 ? 255 : 0;
    }
    alphaCtx.putImageData(transparentImgData, 0, 0);
  }

  function renderAllCharCards() {
    const container = document.getElementById('grid-output-container');
    container.innerHTML = '';
    document.getElementById('charCountTag').innerText = `共 ${finalBoxes.length} 字`;
    if (!sourceImg || finalBoxes.length === 0) return;

    const fragment = document.createDocumentFragment();
    finalBoxes.forEach((bbox, index) => {
      let card = document.createElement('div');
      card.className = 'char-card';

      let idxBadge = document.createElement('span');
      idxBadge.className = 'card-index';
      idxBadge.innerText = index + 1;
      card.appendChild(idxBadge);

      let canvas = document.createElement('canvas');
      canvas.width = 180; canvas.height = 180;
      renderSingleChar(canvas, bbox);

      card.appendChild(canvas);
      fragment.appendChild(card);
    });
    container.appendChild(fragment);
  }

  function renderSingleChar(canvas, bbox) {
    const gridType = document.getElementById('gridTypeSelect').value;
    const globalScale = parseInt(document.getElementById('fontScale').value) / 100;
    const cardSize = canvas.width;
    const ctx = canvas.getContext('2d');

    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, cardSize, cardSize);

    ctx.strokeStyle = '#c0392b';
    ctx.lineWidth = 1;
    ctx.strokeRect(0, 0, cardSize, cardSize);

    ctx.beginPath();
    if (gridType === 'jiu_gong_ge') {
      ctx.moveTo(cardSize / 3, 0); ctx.lineTo(cardSize / 3, cardSize);
      ctx.moveTo((cardSize / 3) * 2, 0); ctx.lineTo((cardSize / 3) * 2, cardSize);
      ctx.moveTo(0, cardSize / 3); ctx.lineTo(cardSize, cardSize / 3);
      ctx.moveTo(0, (cardSize / 3) * 2); ctx.lineTo(cardSize, (cardSize / 3) * 2);
    } else {
      ctx.moveTo(cardSize / 2, 0); ctx.lineTo(cardSize / 2, cardSize);
      ctx.moveTo(0, cardSize / 2); ctx.lineTo(cardSize, cardSize / 2);
      ctx.moveTo(0, 0); ctx.lineTo(cardSize, cardSize);
      ctx.moveTo(cardSize, 0); ctx.lineTo(0, cardSize);
    }
    ctx.stroke();

    let maxDim = Math.max(bbox.width, bbox.height);
    let targetSize = cardSize * globalScale;
    let drawWidth = (bbox.width / maxDim) * targetSize;
    let drawHeight = (bbox.height / maxDim) * targetSize;

    let dx = (cardSize - drawWidth) / 2;
    let dy = (cardSize - drawHeight) / 2;

    if (alphaCanvas) {
      ctx.drawImage(
        alphaCanvas,
        bbox.x, bbox.y, bbox.width, bbox.height, 
        dx, dy, drawWidth, drawHeight
      );
    }
  }

  async function downloadZip() {
    if (finalBoxes.length === 0) {
      alert('尚無可下載的單字卡');
      return;
    }
    showLoading('打包中...');
    const zip = new JSZip();
    const folder = zip.folder("shufa_chars");

    const cards = document.querySelectorAll('.char-card canvas');
    cards.forEach((canvas, idx) => {
      const dataUrl = canvas.toDataURL('image/png');
      const base64Data = dataUrl.replace(/^data:image\/png;base64,/, "");
      folder.file(`char_${idx + 1}.png`, base64Data, {base64: true});
    });

    const content = await zip.generateAsync({type: "blob"});
    saveAs(content, "shufa_chars.zip");
    hideLoading();
  }
</script>
