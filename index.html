<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>可調整選取框 - 書法集字輔助工具</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f5f5f7;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }
    .container {
      position: relative;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      padding: 20px;
      max-width: 100%;
    }
    .canvas-wrapper {
      position: relative;
      display: inline-block;
      user-select: none;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      overflow: hidden;
    }
    canvas {
      display: block;
      cursor: crosshair;
    }
    .toolbar {
      margin-top: 15px;
      display: flex;
      gap: 10px;
      justify-content: flex-end;
    }
    button {
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      background-color: #0071e3;
      color: white;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background-color: #0077ed;
    }
    button.secondary {
      background-color: #e5e5ea;
      color: #1d1d1f;
    }
    button.secondary:hover {
      background-color: #d1d1d6;
    }
    .info {
      margin-top: 10px;
      font-size: 13px;
      color: #6e6e73;
    }
  </style>
</head>
<body>

<div class="container">
  <h3>書法選取範圍調整</h3>
  <div class="canvas-wrapper">
    <canvas id="mainCanvas"></canvas>
  </div>
  <div class="toolbar">
    <button class="secondary" onclick="resetCrop()">重置框選</button>
    <button onclick="confirmCrop()">確認切分墨跡</button>
  </div>
  <div class="info" id="statusInfo">提示：在畫面上拖曳滑鼠以建立框選區，建立後可拉動 8 個控制點調整大小或按住內部移動。</div>
</div>

<script>
const canvas = document.getElementById('mainCanvas');
const ctx = canvas.getContext('2d');
const statusInfo = document.getElementById('statusInfo');

let img = new Image();
// 範例圖檔或載入使用者上傳圖像
img.src = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="400" height="600"><rect width="100%" height="100%" fill="%23f9f9f9"/><text x="50%" y="40%" font-size="30" text-anchor="middle" fill="%23333">請拖曳選擇框</text><text x="50%" y="50%" font-size="20" text-anchor="middle" fill="%23666">（示範字帖區域）</text></svg>';

// 選取框狀態數據
let box = null; // { x, y, width, height }
let isDrawing = false;
let isDragging = false;
let isResizing = false;
let activeHandle = null;

let startX = 0, startY = 0;
let dragOffsetX = 0, dragOffsetY = 0;

const HANDLE_SIZE = 8;
const HANDLES = ['nw', 'n', 'ne', 'e', 'se', 's', 'sw', 'w'];

img.onload = () => {
  canvas.width = img.width || 400;
  canvas.height = img.height || 600;
  
  // 預設給一個初始化區域
  box = {
    x: canvas.width * 0.1,
    y: canvas.height * 0.1,
    width: canvas.width * 0.8,
    height: canvas.height * 0.8
  };
  
  draw();
};

// 繪製主邏輯
function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  
  // 1. 繪製底圖
  ctx.drawImage(img, 0, 0);

  if (!box) return;

  // 2. 繪製遮罩層 (非選取區域變暗)
  ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  
  // 清除選取區域內的遮罩
  ctx.clearRect(box.x, box.y, box.width, box.height);
  ctx.drawImage(img, box.x, box.y, box.width, box.height, box.x, box.y, box.width, box.height);

  // 3. 繪製選取框紅線
  ctx.strokeStyle = '#e63946';
  ctx.lineWidth = 2;
  ctx.setLineDash([4, 4]);
  ctx.strokeRect(box.x, box.y, box.width, box.height);
  ctx.setLineDash([]); // 還原實線

  // 4. 繪製 8 個控制點
  const handles = getHandleCoords();
  ctx.fillStyle = '#ffffff';
  ctx.strokeStyle = '#e63946';
  ctx.lineWidth = 1.5;

  for (let key in handles) {
    let h = handles[key];
    ctx.fillRect(h.x - HANDLE_SIZE / 2, h.y - HANDLE_SIZE / 2, HANDLE_SIZE, HANDLE_SIZE);
    ctx.strokeRect(h.x - HANDLE_SIZE / 2, h.y - HANDLE_SIZE / 2, HANDLE_SIZE, HANDLE_SIZE);
  }
}

// 取得 8 個控制點座標
function getHandleCoords() {
  if (!box) return {};
  const { x, y, width, height } = box;
  return {
    nw: { x: x, y: y },
    n:  { x: x + width / 2, y: y },
    ne: { x: x + width, y: y },
    e:  { x: x + width, y: y + height / 2 },
    se: { x: x + width, y: y + height },
    s:  { x: x + width / 2, y: y + height },
    sw: { x: x, y: y + height },
    w:  { x: x, y: y + height / 2 }
  };
}

// 事件處理：滑鼠按下
canvas.addEventListener('mousedown', (e) => {
  const rect = canvas.getBoundingClientRect();
  const mouseX = e.clientX - rect.left;
  const mouseY = e.clientY - rect.top;

  if (box) {
    // 檢查是否點擊在控制點上
    const handles = getHandleCoords();
    for (let key in handles) {
      let h = handles[key];
      if (Math.abs(mouseX - h.x) <= HANDLE_SIZE && Math.abs(mouseY - h.y) <= HANDLE_SIZE) {
        isResizing = true;
        activeHandle = key;
        startX = mouseX;
        startY = mouseY;
        return;
      }
    }

    // 檢查是否點擊在選取框內部 (拖曳移動)
    if (mouseX >= box.x && mouseX <= box.x + box.width &&
        mouseY >= box.y && mouseY <= box.y + box.height) {
      isDragging = true;
      dragOffsetX = mouseX - box.x;
      dragOffsetY = mouseY - box.y;
      return;
    }
  }

  // 重新拖曳劃定新框
  isDrawing = true;
  startX = mouseX;
  startY = mouseY;
  box = { x: startX, y: startY, width: 0, height: 0 };
});

// 事件處理：滑鼠移動
canvas.addEventListener('mousemove', (e) => {
  const rect = canvas.getBoundingClientRect();
  const mouseX = e.clientX - rect.left;
  const mouseY = e.clientY - rect.top;

  // 動態改變游標樣式
  if (box && !isDrawing && !isDragging && !isResizing) {
    const handles = getHandleCoords();
    let hoveredHandle = false;
    for (let key in handles) {
      let h = handles[key];
      if (Math.abs(mouseX - h.x) <= HANDLE_SIZE && Math.abs(mouseY - h.y) <= HANDLE_SIZE) {
        canvas.style.cursor = key + '-resize';
        hoveredHandle = true;
        break;
      }
    }
    if (!hoveredHandle) {
      if (mouseX >= box.x && mouseX <= box.x + box.width &&
          mouseY >= box.y && mouseY <= box.y + box.height) {
        canvas.style.cursor = 'move';
      } else {
        canvas.style.cursor = 'crosshair';
      }
    }
  }

  // 邏輯 1: 畫新框
  if (isDrawing) {
    box.width = mouseX - startX;
    box.height = mouseY - startY;
    draw();
  }

  // 邏輯 2: 移動整個框
  if (isDragging) {
    box.x = Math.max(0, Math.min(canvas.width - box.width, mouseX - dragOffsetX));
    box.y = Math.max(0, Math.min(canvas.height - box.height, mouseY - dragOffsetY));
    draw();
  }

  // 邏輯 3: 調整控制點大小
  if (isResizing && activeHandle) {
    let dx = mouseX - startX;
    let dy = mouseY - startY;

    if (activeHandle.includes('e')) box.width += dx;
    if (activeHandle.includes('s')) box.height += dy;
    if (activeHandle.includes('w')) {
      box.x += dx;
      box.width -= dx;
    }
    if (activeHandle.includes('n')) {
      box.y += dy;
      box.height -= dy;
    }

    startX = mouseX;
    startY = mouseY;
    draw();
  }
});

// 事件處理：滑鼠放開
window.addEventListener('mouseup', () => {
  if (isDrawing) {
    // 修正反向拉框的寬高負值
    if (box.width < 0) {
      box.x += box.width;
      box.width = Math.abs(box.width);
    }
    if (box.height < 0) {
      box.y += box.height;
      box.height = Math.abs(box.height);
    }
  }
  
  isDrawing = false;
  isDragging = false;
  isResizing = false;
  activeHandle = null;
  
  if (box) updateStatus();
});

function updateStatus() {
  statusInfo.innerText = `目前選取範圍：X: ${Math.round(box.x)}, Y: ${Math.round(box.y)}, 寬: ${Math.round(box.width)}, 高: ${Math.round(box.height)}`;
}

function resetCrop() {
  box = null;
  draw();
  statusInfo.innerText = '請在畫面上拖曳滑鼠以建立框選區。';
}

function confirmCrop() {
  if (!box || box.width === 0 || box.height === 0) {
    alert('請先框選有效的區域！');
    return;
  }
  alert(`已確認選取區域！\n坐標：(${Math.round(box.x)}, ${Math.round(box.y)})\n尺寸：${Math.round(box.width)} x ${Math.round(box.height)}`);
}
</script>

</body>
</html>
