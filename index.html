<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>書法集字格化工具 PWA V0.02</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2c3e50">
  <link rel="apple-touch-icon" href="icon.png">

  <script async src="https://docs.opencv.org/4.x/opencv.js" onload="cvReady=true"></script>
  <script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

  <style>
    :root { --primary: #2c3e50; --accent: #e74c3c; --bg: #f8f9fa; }
    * { box-sizing: border-box; }
    body { font-family: -apple-system, sans-serif; background: var(--bg); margin: 0; padding: 15px; color: #333; touch-action: manipulation; }
    .container { max-width: 1200px; margin: 0 auto; }
    h1 { text-align: center; color: var(--primary); font-size: 1.5rem; margin-bottom: 15px; }
    
    .panel { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 15px; }
    .controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; align-items: center; }
    label { font-weight: bold; display: block; margin-bottom: 4px; font-size: 12px; }
    select, input, button { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
    button { background: var(--primary); color: white; border: none; font-weight: bold; cursor: pointer; user-select: none; }
    .btn-action { background: var(--accent); }
    
    .workspace { display: grid; grid-template-columns: 1.2fr 1fr; gap: 15px; }
    @media (max-width: 768px) { .workspace { grid-template-columns: 1fr; } }
    
    #source-wrapper { border: 2px dashed #ccc; position: relative; overflow: hidden; background: #fafafa; cursor: crosshair; touch-action: none; }
    #sourceCanvas { display: block; max-width: 100%; height: auto; }
    
    #grid-output-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px; padding: 10px; background: #eee; border-radius: 8px; max-height: 65vh; overflow-y: auto; }
    .char-card { background: white; border-radius: 4px; padding: 4px; box-shadow: 0 1px 4px rgba(0,0,0,0.15); text-align: center; cursor: pointer; }
    .char-card.selected { border: 2px solid #3498db; }
    .char-card canvas { width: 100%; height: auto; display: block; }
    
    #loadingOverlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); color: white; justify-content: center; align-items: center; z-index: 2000; font-size: 16px; flex-direction: column; }
    .modal { display: none; position: fixed; inset: 0; z-index: 1000; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; }
    .modal-content { background: #fff; padding: 15px; border-radius: 8px; width: 310px; text-align: center; }
    #modalCanvas { border: 2px solid #3498db; touch-action: none; cursor: grab; width: 280px; height: 280px; background: #fff; border-radius: 6px; }
    .dpad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; width: 150px; margin: 8px auto; }
    .zoom-ctrl { display: flex; align-items: center; gap: 8px; margin: 8px 0; font-size: 12px; }
  </style>
</head>
<body>

<div id="loadingOverlay"><div id="loadingText">處理中...</div></div>

<div class="container">
  <h1>書法集字格化工具 (PWA V0.02)</h1>

  <div class="panel">
    <div class="controls">
      <div><label>1. 上傳圖片 (含 HEIC)</label><input type="file" id="fileInput" accept="image/*,.heic,.heif"></div>
      <div>
        <label>2. 格線類型</label>
        <select id="gridTypeSelect" onchange="renderAllCharCards()">
          <option value="mi_zi_ge">米字格</option>
          <option value="jiu_gong_ge" selected>九宮格</option>
        </select>
      </div>
      <div>
        <label>3. 自動辨識感度 (<span id="mergeVal">40</span>px)</label>
        <input type="range" id="mergeThresh" min="5" max="80" value="40" oninput="debouncedProcessImage()">
      </div>
      <div>
        <label>4. 全局單字縮放 (<span id="scaleVal">80</span>%)</label>
        <input type="range" id="fontScale" min="60" max="95" value="80" oninput="document.getElementById('scaleVal').innerText=this.value; renderAllCharCards();">
      </div>
      <div><button class="btn-action" onclick="downloadZip()">打包下載全部 (ZIP)</button></div>
    </div>
  </div>

  <div class="workspace">
    <div class="panel">
      <h3>原圖預覽 (可直接拉框圈選或調整)</h3>
      <div id="source-wrapper"><canvas id="sourceCanvas"></canvas></div>
    </div>
    <div class="panel">
      <h3>集字結果 (點擊單字微調)</h3>
      <div id="grid-output-container"></div>
    </div>
  </div>
</div>

<div id="editModal" class="modal">
  <div class="modal-content">
    <h3>單字手勢/大小微調</h3>
    <canvas id="modalCanvas" width="280" height="280"></canvas>
    <div style="font-size:11px; color:#c0392b; font-weight:bold; margin:4px 0;">💡 手指拖動位移 / 雙指捏合縮放</div>
    
    <div class="zoom-ctrl">
      <label style="margin:0; min-width:55px;">大小:</label>
      <button style="width:30px;" onclick="adjustScale(-0.05)">－</button>
      <input type="range" id="modalScaleSlider" min="0.3" max="2.0" step="0.02" value="1.0" oninput="onModalScaleInput(this.value)">
      <button style="width:30px;" onclick="adjustScale(0.05)">＋</button>
    </div>

    <div class="dpad">
      <div></div><button onclick="adjustOffset(0, -5)">▲</button><div></div>
      <button onclick="adjustOffset(-5, 0)">◄</button><button onclick="resetSingleChar()">重置</button><button onclick="adjustOffset(5, 0)">►</button>
      <div></div><button onclick="adjustOffset(0, 5)">▼</button><div></div>
    </div>
    
    <div style="display:flex; gap:8px; margin-top:8px;">
      <button class="btn-action" onclick="deleteCurrentBox()">刪除此字</button>
      <button onclick="closeModal()">完成</button>
    </div>
  </div>
</div>

<script>
  let cvReady = false, finalBoxes = [], sourceImgElement = null, rawImageCanvas = null;
  let currentEditingIndex = -1, debounceTimer = null;
  let selectedBoxIndex = -1, isInteraction = false, activeHandle = null;
  let startX = 0, startY = 0, initialBox = null;

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');

  const toggleLoading = (show, msg = '處理中...') => {
    document.getElementById('loadingText').innerText = msg;
    document.getElementById('loadingOverlay').style.display = show ? 'flex' : 'none';
  };

  function debouncedProcessImage() {
    document.getElementById('mergeVal').innerText = document.getElementById('mergeThresh').value;
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(processImage, 100);
  }

  document.getElementById('fileInput').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    toggleLoading(true, '讀取圖片...');
    let blob = file;

    if (file.name.toLowerCase().match(/\.(heic|heif)$/)) {
      toggleLoading(true, '轉碼 HEIC...');
      try {
        const res = await heic2any({ blob: file, toType: "image/jpeg" });
        blob = Array.isArray(res) ? res[0] : res;
      } catch (err) { alert('HEIC 轉碼失敗'); toggleLoading(false); return; }
    }

    const reader = new FileReader();
    reader.onload = (evt) => {
      const img = new Image();
      img.onload = () => {
        sourceImgElement = img;
        rawImageCanvas = document.createElement('canvas');
        rawImageCanvas.width = img.width; rawImageCanvas.height = img.height;
        rawImageCanvas.getContext('2d').drawImage(img, 0, 0);

        const sCanvas = document.getElementById('sourceCanvas');
        sCanvas.width = img.width; sCanvas.height = img.height;
        processImage();
        toggleLoading(false);
      };
      img.src = evt.target.result;
    };
    reader.readAsDataURL(blob);
  });

  function processImage() {
    if (!cvReady || !rawImageCanvas) return;

    const mergeDist = parseInt(document.getElementById('mergeThresh').value);
    let src = cv.imread(rawImageCanvas);
    let gray = new cv.Mat(), binary = new cv.Mat(), dilated = new cv.Mat();
    cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);

    let meanVal = cv.mean(gray)[0];
    let isDarkBg = meanVal < 128;
    cv.threshold(gray, binary, isDarkBg ? 100 : 180, 255, isDarkBg ? cv.THRESH_BINARY : cv.THRESH_BINARY_INV);

    let M = cv.Mat.ones(5, 5, cv.CV_8U);
    cv.dilate(binary, dilated, M);

    let contours = new cv.MatVector(), hierarchy = new cv.Mat();
    cv.findContours(dilated, contours, hierarchy, cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);

    let rawBoxes = [], minArea = rawImageCanvas.width * rawImageCanvas.height * 0.002;
    for (let i = 0; i < contours.size(); ++i) {
      let r = cv.boundingRect(contours.get(i));
      if (r.width * r.height > minArea) rawBoxes.push(r);
    }

    rawBoxes.sort((a, b) => a.y - b.y);
    let mergedBoxes = [];
    while (rawBoxes.length > 0) {
      let cur = rawBoxes.shift(), merged = true;
      while (merged) {
        merged = false;
        for (let i = 0; i < rawBoxes.length; i++) {
          let t = rawBoxes[i];
          if ((Math.max(cur.x, t.x) - Math.min(cur.x + cur.width, t.x + t.width) < mergeDist) &&
              (Math.max(cur.y, t.y) - Math.min(cur.y + cur.height, t.y + t.height) < mergeDist)) {
            let minX = Math.min(cur.x, t.x), minY = Math.min(cur.y, t.y);
            cur = { x: minX, y: minY, width: Math.max(cur.x + cur.width, t.x + t.width) - minX, height: Math.max(cur.y + cur.height, t.y + t.height) - minY };
            rawBoxes.splice(i, 1);
            merged = true; break;
          }
        }
      }
      cur.offsetX = 0; cur.offsetY = 0; cur.customScale = 1.0;
      mergedBoxes.push(cur);
    }

    mergedBoxes.sort((a, b) => Math.abs((b.x + b.width/2) - (a.x + a.width/2)) > (rawImageCanvas.width * 0.12) ? (b.x - a.x) : (a.y - b.y));
    finalBoxes = mergedBoxes;

    src.delete(); gray.delete(); binary.delete(); dilated.delete(); M.delete(); contours.delete(); hierarchy.delete();
    drawSourceWithBoxes();
    renderAllCharCards();
  }

  function drawSourceWithBoxes() {
    const sCanvas = document.getElementById('sourceCanvas');
    if (!sCanvas || !rawImageCanvas) return;
    const ctx = sCanvas.getContext('2d');
    ctx.drawImage(rawImageCanvas, 0, 0);

    finalBoxes.forEach((b, idx) => {
      let isSel = (idx === selectedBoxIndex);
      ctx.strokeStyle = isSel ? '#3498db' : '#e74c3c';
      ctx.lineWidth = isSel ? 4 : 2;
      ctx.strokeRect(b.x, b.y, b.width, b.height);

      if (isSel) {
        ctx.fillStyle = '#3498db';
        let handles = getBoxHandles(b);
        Object.values(handles).forEach(h => {
          ctx.beginPath();
          ctx.arc(h.x, h.y, 6, 0, Math.PI * 2);
          ctx.fill();
        });
      }
    });
  }

  function getBoxHandles(b) {
    return {
      tl: { x: b.x, y: b.y },
      tr: { x: b.x + b.width, y: b.y },
      bl: { x: b.x, y: b.y + b.height },
      br: { x: b.x + b.width, y: b.y + b.height }
    };
  }

  const sCanvas = document.getElementById('sourceCanvas');
  function getCanvasCoords(e) {
    const rect = sCanvas.getBoundingClientRect();
    const scaleX = sCanvas.width / rect.width;
    const scaleY = sCanvas.height / rect.height;
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return { x: (clientX - rect.left) * scaleX, y: (clientY - rect.top) * scaleY };
  }

  sCanvas.addEventListener('pointerdown', (e) => {
    if (!rawImageCanvas) return;
    const pos = getCanvasCoords(e);
    startX = pos.x; startY = pos.y;
    isInteraction = true;

    if (selectedBoxIndex >= 0) {
      let handles = getBoxHandles(finalBoxes[selectedBoxIndex]);
      for (let key in handles) {
        if (Math.hypot(pos.x - handles[key].x, pos.y - handles[key].y) < 20) {
          activeHandle = key;
          initialBox = { ...finalBoxes[selectedBoxIndex] };
          return;
        }
      }
    }

    let hitIndex = finalBoxes.findIndex(b => pos.x >= b.x && pos.x <= b.x + b.width && pos.y >= b.y && pos.y <= b.y + b.height);
    if (hitIndex >= 0) {
      selectedBoxIndex = hitIndex;
      activeHandle = 'move';
      initialBox = { ...finalBoxes[hitIndex] };
    } else {
      selectedBoxIndex = -1;
      activeHandle = 'create';
    }
    drawSourceWithBoxes();
    highlightCard(selectedBoxIndex);
  });

  window.addEventListener('pointermove', (e) => {
    if (!isInteraction || !rawImageCanvas) return;
    const pos = getCanvasCoords(e);
    const dx = pos.x - startX, dy = pos.y - startY;

    if (activeHandle === 'create') {
      let x = Math.min(startX, pos.x), y = Math.min(startY, pos.y);
      let w = Math.abs(dx), h = Math.abs(dy);
      if (w > 10 && h > 10) {
        if (selectedBoxIndex === -1 || selectedBoxIndex !== finalBoxes.length - 1) {
          finalBoxes.push({ x, y, width: w, height: h, offsetX: 0, offsetY: 0, customScale: 1.0 });
          selectedBoxIndex = finalBoxes.length - 1;
        } else {
          finalBoxes[selectedBoxIndex] = { x, y, width: w, height: h, offsetX: 0, offsetY: 0, customScale: 1.0 };
        }
      }
    } else if (activeHandle === 'move' && selectedBoxIndex >= 0) {
      finalBoxes[selectedBoxIndex].x = initialBox.x + dx;
      finalBoxes[selectedBoxIndex].y = initialBox.y + dy;
    } else if (activeHandle && selectedBoxIndex >= 0) {
      let b = { ...initialBox };
      if (activeHandle.includes('r')) b.width = Math.max(10, initialBox.width + dx);
      if (activeHandle.includes('b')) b.height = Math.max(10, initialBox.height + dy);
      if (activeHandle.includes('l')) { let nw = initialBox.width - dx; if (nw > 10) { b.x = initialBox.x + dx; b.width = nw; } }
      if (activeHandle.includes('t')) { let nh = initialBox.height - dy; if (nh > 10) { b.y = initialBox.y + dy; b.height = nh; } }
      finalBoxes[selectedBoxIndex] = b;
    }
    drawSourceWithBoxes();
  });

  window.addEventListener('pointerup', () => {
    if (isInteraction) {
      isInteraction = false; activeHandle = null;
      renderAllCharCards();
    }
  });

  function renderAllCharCards() {
    const container = document.getElementById('grid-output-container');
    container.innerHTML = '';
    if (!rawImageCanvas || finalBoxes.length === 0) return;

    const frag = document.createDocumentFragment();
    finalBoxes.forEach((bbox, idx) => {
      let card = document.createElement('div');
      card.className = `char-card ${idx === selectedBoxIndex ? 'selected' : ''}`;
      card.id = `char-card-${idx}`;
      card.onclick = () => {
        selectedBoxIndex = idx;
        drawSourceWithBoxes();
        highlightCard(idx);
        openEditModal(idx);
      };

      let canvas = document.createElement('canvas');
      canvas.width = 180; canvas.height = 180;
      renderSingleChar(canvas, bbox);

      card.appendChild(canvas);
      frag.appendChild(card);
    });
    container.appendChild(frag);
  }

  function highlightCard(idx) {
    document.querySelectorAll('.char-card').forEach((c, i) => {
      c.classList.toggle('selected', i === idx);
    });
  }

  function renderSingleChar(canvas, bbox) {
    const gridType = document.getElementById('gridTypeSelect').value;
    const globalScale = parseInt(document.getElementById('fontScale').value) / 100;
    const finalScale = globalScale * (bbox.customScale || 1.0);
    const sz = canvas.width, ctx = canvas.getContext('2d');

    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, sz, sz);
    ctx.strokeStyle = '#e74c3c'; ctx.lineWidth = 1; ctx.strokeRect(0, 0, sz, sz);

    ctx.beginPath();
    if (gridType === 'jiu_gong_ge') {
      ctx.moveTo(sz/3, 0); ctx.lineTo(sz/3, sz); ctx.moveTo((sz/3)*2, 0); ctx.lineTo((sz/3)*2, sz);
      ctx.moveTo(0, sz/3); ctx.lineTo(sz, sz/3); ctx.moveTo(0, (sz/3)*2); ctx.lineTo(sz, (sz/3)*2);
    } else {
      ctx.moveTo(sz/2, 0); ctx.lineTo(sz/2, sz); ctx.moveTo(0, sz/2); ctx.lineTo(sz, sz/2);
      ctx.moveTo(0, 0); ctx.lineTo(sz, sz); ctx.moveTo(sz, 0); ctx.lineTo(0, sz);
    }
    ctx.stroke();

    let maxDim = Math.max(bbox.width, bbox.height);
    let targetSize = sz * finalScale;
    let dw = (bbox.width / maxDim) * targetSize, dh = (bbox.height / maxDim) * targetSize;
    let dx = ((sz - dw) / 2) + (bbox.offsetX || 0), dy = ((sz - dh) / 2) + (bbox.offsetY || 0);

    // V0.02 直接讀取原圖 Canvas 繪製，完全保留墨色與宣紙質感
    ctx.drawImage(rawImageCanvas, bbox.x, bbox.y, bbox.width, bbox.height, dx, dy, dw, dh);
  }

  function openEditModal(index) {
    currentEditingIndex = index;
    document.getElementById('modalScaleSlider').value = finalBoxes[index].customScale || 1.0;
    document.getElementById('editModal').style.display = 'flex';
    updateModalPreview();
  }

  function closeModal() {
    document.getElementById('editModal').style.display = 'none';
    if (currentEditingIndex >= 0) {
      const targetCanvas = document.querySelector(`#char-card-${currentEditingIndex} canvas`);
      if (targetCanvas) renderSingleChar(targetCanvas, finalBoxes[currentEditingIndex]);
    }
  }

  function updateModalPreview() {
    if (currentEditingIndex >= 0) {
      renderSingleChar(document.getElementById('modalCanvas'), finalBoxes[currentEditingIndex]);
    }
  }

  function adjustOffset(dx, dy) {
    if (currentEditingIndex < 0) return;
    finalBoxes[currentEditingIndex].offsetX = (finalBoxes[currentEditingIndex].offsetX || 0) + dx;
    finalBoxes[currentEditingIndex].offsetY = (finalBoxes[currentEditingIndex].offsetY || 0) + dy;
    updateModalPreview();
  }

  function onModalScaleInput(val) {
    if (currentEditingIndex < 0) return;
    finalBoxes[currentEditingIndex].customScale = parseFloat(val);
    updateModalPreview();
  }

  function adjustScale(delta) {
    if (currentEditingIndex < 0) return;
    let nextScale = Math.max(0.3, Math.min(2.0, (finalBoxes[currentEditingIndex].customScale || 1.0) + delta));
    finalBoxes[currentEditingIndex].customScale = nextScale;
    document.getElementById('modalScaleSlider').value = nextScale;
    updateModalPreview();
  }

  function resetSingleChar() {
    if (currentEditingIndex < 0) return;
    finalBoxes[currentEditingIndex].offsetX = 0;
    finalBoxes[currentEditingIndex].offsetY = 0;
    finalBoxes[currentEditingIndex].customScale = 1.0;
    document.getElementById('modalScaleSlider').value = 1.0;
    updateModalPreview();
  }

  function deleteCurrentBox() {
    if (currentEditingIndex < 0) return;
    finalBoxes.splice(currentEditingIndex, 1);
    currentEditingIndex = -1; selectedBoxIndex = -1;
    document.getElementById('editModal').style.display = 'none';
    drawSourceWithBoxes();
    renderAllCharCards();
  }

  async function downloadZip() {
    if (finalBoxes.length === 0) return alert('尚無單字卡');
    toggleLoading(true, '打包圖片中...');
    const zip = new JSZip(), folder = zip.folder("shufa_chars");

    document.querySelectorAll('.char-card canvas').forEach((cvs, idx) => {
      folder.file(`char_${idx + 1}.png`, cvs.toDataURL('image/png').replace(/^data:image\/png;base64,/, ""), {base64: true});
    });

    saveAs(await zip.generateAsync({type: "blob"}), "shufa_chars.zip");
    toggleLoading(false);
  }
</script>
</body>
</html>
